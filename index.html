<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotton Candy Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Cotton Candy Calculator</h1>
        <div class="display">
            <div id="result">0</div>
        </div>
        <div class="buttons">
            <button class="clear" data-action="clear">C</button>
            <button class="operator" data-action="delete">⌫</button>
            <button class="operator" data-value="/">/</button>
            <button class="operator" data-value="*">×</button>
            
            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="-">-</button>
            
            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="+">+</button>
            
            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator equals" data-action="calculate">=</button>
            
            <button class="number" data-value="0">0</button>
            <button class="number" data-value=".">.</button>
        </div>
        <div class="decoration">
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
        </div>
        <div class="history" id="history"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
